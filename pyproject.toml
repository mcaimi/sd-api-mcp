[project]
name = "sd-api-mcp"
version = "0.1.0"
description = "MCP server for the sd-api-backend project"
readme = "README.md"
authors = [{ name = "Marco Caimi", email = "mcaimi@redhat.com" }]
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1", "mcp[cli]>=2.0.0"]

[project.scripts]
sd-api-mcp = "sd_api_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
